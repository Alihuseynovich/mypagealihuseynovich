<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 400px;
}

/* PROFILE */
.profile img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 4px solid #ddd;
    object-fit: cover;
}

/* SOCIAL */
.social {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
}

.social a img {
    width: 26px;
    height: 26px;
    cursor: pointer;
    opacity: 0.85;
    transition: 0.3s ease;
}

.social a img:active {
    transform: scale(0.9);
}

.social a img:hover {
    transform: scale(1.2);
}

/* NAME */
.name {
    margin-top: 25px;
    font-size: 18px;
    letter-spacing: 2px;
    position: relative;
    padding: 8px 15px;
}

.name::before,
.name::after {
    content: "";
    position: absolute;
    height: 1px;
    width: 15px;
    background: rgba(0,0,0,0.6);
    top: 50%;
    transform: translateY(-50%);
}

.name::before { left: -20px; }
.name::after { right: -20px; }

/* MAIL ICON */
.mail-icon {
    margin-top: 10px;
}

.mail-icon img {
    width: 70px;
    max-width: 100%;
    cursor: pointer;
    transition: 0.25s;
}

.mail-icon img:hover {
    transform: scale(1.1);
}

/* FORM */
.contact-form {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;

    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: 0.4s ease;
}

.contact-form.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
}

.contact-form input,
.contact-form textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
}

.contact-form textarea {
    resize: none;
    height: 80px;
}

.contact-form button {
    padding: 10px;
    border: none;
    background: black;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.contact-form button:hover {
    background: #333;
}

/* 📱 MOBILE (extra kiçik ekranlar) */
@media (max-width: 480px) {
    .profile img {
        width: 120px;
        height: 120px;
    }

    .name {
        font-size: 16px;
    }

    .mail-icon img {
        width: 60px;
    }
}

/* 💻 LARGE SCREENS */
@media (min-width: 768px) {
    .container {
        max-width: 450px;
    }

    .profile img {
        width: 160px;
        height: 160px;
    }

    .name {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="profile">
        <img src="image.jpg" alt="Profile image">
    </div>

    <div class="social">
        <a href="#"><img src="https://img.icons8.com/?size=100&id=Xy10Jcu1L2Su&format=png"></a>
        <a href="#"><img src="https://img.icons8.com/?size=100&id=xuvGCOXi8Wyg&format=png"></a>
        <a href="#"><img src="https://img.icons8.com/?size=100&id=13912&format=png"></a>
        <a href="#"><img src="https://img.icons8.com/?size=100&id=QyYjooyvYGgV&format=png"></a>
    </div>

    <div class="name">Alihuseynovich</div>

    <div class="mail-icon">
        <img src="https://formspree.io/static/81f34291e348b636ef005a5039c42114.svg" id="openForm">
    </div>

    <form action="https://formspree.io/f/xrervylw" method="POST" class="contact-form" id="contactForm">
        <input type="text" name="name" placeholder="Adınız" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Mesajınız" required></textarea>
        <button type="submit">Göndər</button>
    </form>

</div>

<script>
const btn = document.getElementById("openForm");
const form = document.getElementById("contactForm");

btn.addEventListener("click", () => {
    form.classList.toggle("active");
});
</script>

</body>
</html>
