<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* PROFILE */
.profile img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid #ddd;
    object-fit: cover;
}

/* SOCIAL */
.social {
    margin-top: 25px;
    display: flex;
    gap: 15px;
}

.social a img {
    width: 26px;
    height: 26px;
    cursor: pointer;
    opacity: 0.85;
    transition: 0.3s ease;
}

.social a img:active {
    transform: scale(0.9);
}

.social a:nth-child(1) img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 8px red);
}

.social a:nth-child(2) img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 8px #0A66C2);
}

.social a:nth-child(3) img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 8px #003366);
}

.social a:nth-child(4) img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 8px red);
}

/* NAME */
.name {
    margin-top: 30px;
    font-size: 20px;
    letter-spacing: 2px;
    position: relative;
    padding: 10px 20px;
}

.name::before,
.name::after {
    content: "";
    position: absolute;
    height: 1px;
    width: 18px;
    background: rgba(0,0,0,0.6);
    top: 50%;
    transform: translateY(-50%);
}

.name::before { left: -25px; }
.name::after { right: -25px; }

/* MAIL ICON */
.mail-icon {
    margin-top: 12px;
}

.mail-icon img {
    width: 85px;
    cursor: pointer;
    transition: transform 0.25s ease, filter 0.25s ease;
    opacity: 0.95;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.25));
}

.mail-icon img:hover {
    transform: scale(1.12);
    filter: drop-shadow(0 0 6px red);
}

/* FORM */
.contact-form {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 260px;

    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: 0.4s ease;
}

.contact-form.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
}

.contact-form input,
.contact-form textarea {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.contact-form textarea {
    resize: none;
    height: 80px;
}

.contact-form button {
    padding: 10px;
    border: none;
    background: black;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.contact-form button:hover {
    background: #333;
}
</style>
</head>

<body>

<div class="container">

    <!-- PROFILE IMAGE -->
    <div class="profile">
        <img src="image.jpg" alt="Profile image">
    </div>

    <!-- SOCIAL -->
    <div class="social">
        <a href="https://www.instagram.com/alihuseynovich/" target="_blank">
            <img src="https://img.icons8.com/?size=100&id=Xy10Jcu1L2Su&format=png&color=000000">
        </a>

        <a href="https://az.linkedin.com/in/alihuseynovich" target="_blank">
            <img src="https://img.icons8.com/?size=100&id=xuvGCOXi8Wyg&format=png&color=000000">
        </a>

        <a href="https://www.facebook.com/" target="_blank">
            <img src="https://img.icons8.com/?size=100&id=13912&format=png&color=000000">
        </a>

        <a href="https://www.youtube.com/@alihuseynovich" target="_blank">
            <img src="https://img.icons8.com/?size=100&id=QyYjooyvYGgV&format=png&color=000000">
        </a>
    </div>

    <!-- NAME -->
    <div class="name">
        Alihuseynovich
    </div>

    <!-- MAIL ICON -->
    <div class="mail-icon">
        <img src="https://formspree.io/static/81f34291e348b636ef005a5039c42114.svg" id="openForm">
    </div>

    <!-- FORM -->
    <form action="https://formspree.io/f/xrervylw" method="POST" class="contact-form" id="contactForm">
        <input type="text" name="name" placeholder="Adınız" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Mesajınız" required></textarea>
        <button type="submit">Göndər</button>
    </form>

</div>

<script>
const btn = document.getElementById("openForm");
const form = document.getElementById("contactForm");

btn.addEventListener("click", () => {
    form.classList.toggle("active");
});
</script>

</body>
</html>
