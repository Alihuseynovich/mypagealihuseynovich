<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alihuseynovich</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #e0e0e0 0%, #ffffff 100%);
        }

        /* Ana Şüşə Xana */
        .box {
            width: 300px;
            height: 315px; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px; 
            box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.15);
            padding: 20px 15px 15px 15px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            overflow: hidden;
            position: relative;
        }

        /* Başlıq hissəsi */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px; 
        }

        .brand-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #1a2a4a;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .brand-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
            filter: invert(13%) sepia(21%) saturate(3019%) hue-rotate(198deg) brightness(93%) contrast(97%);
        }

        /* Profil bölməsi */
        .profile-section {
            display: flex;
            align-items: center; 
            gap: 12px;           
            margin-bottom: 20px; 
        }

        .profile-img {
            width: 55px;         
            height: 55px;
            border-radius: 12px; 
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.4); 
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;            
        }

        .profile-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;    
            font-size: 14px;
            color: #1a2a4a;
            line-height: 1.2;
        }

        .profile-email {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;    
            font-size: 11px;     
            color: #4a5568;      
            line-height: 1.2;
        }

        /* Konteynerlərin ümumi animasiya keçid tənzimləmələri */
        .menu-container, .social-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 100%;
        }

        /* Aktiv olmayan hissəni gizlətmək üçün */
        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.9);
        }

        /* Uzunsov şüşə xanalar */
        .mini-box {
            width: 100%;            
            height: 36px;          
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .mini-box span {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 11px; 
            color: #1a2a4a;
            letter-spacing: 0.3px;
        }

        .mini-box:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-1px); 
        }

        /* SOSİAL ŞƏBƏKƏ KONTEYNERİ */
        .social-container {
            align-items: center;
            justify-content: center;
            gap: 20px; 
            padding-top: 10px; 
        }

        .social-icons-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px; 
        }

        .social-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .social-link img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            filter: invert(13%) sepia(21%) saturate(3019%) hue-rotate(198deg) brightness(93%) contrast(97%);
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.7);
            transform: translateY(-3px) scale(1.08); 
        }

        /* GERİ QAYITMAQ (HOME) DÜYMƏSİ */
        .back-button {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .back-button img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: invert(13%) sepia(21%) saturate(3019%) hue-rotate(198deg) brightness(93%) contrast(97%);
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.15); 
        }

        .back-button:hover img {
            opacity: 1;
        }

        /* Ən altdakı imza yazısı */
        .footer-signature {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 8px; 
            color: #1a2a4a;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0.55; 
            margin-top: auto; 
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="brand-header">
            <span class="brand-text">Alihuseynovich</span>
            <img src="https://img.icons8.com/?size=100&id=2yC9SZKcXDdX&format=png&color=000000" alt="icon" class="brand-icon">
        </div>

        <div class="profile-section">
            <img src="image.jpg" alt="Profil şəkli" class="profile-img">
            
            <div class="profile-info">
                <span class="profile-name">Saleh Azimov</span>
                <span class="profile-email">alihuseynovich@gmail.com</span>
            </div>
        </div>

        <div class="menu-container" id="mainMenu">
            <div class="mini-box" onclick="showSection('socialMenu')">
                <span>social profile</span>
            </div>
            <div class="mini-box" onclick="location.href='old.html'">
                <span>old version</span>
            </div>
            <div class="mini-box" onclick="window.open('https://alihuseynovich.github.io/giftframeaz/', '_blank')">
                <span>my shop</span>
            </div>
        </div>

        <div class="social-container hidden" id="socialMenu">
            <div class="social-icons-row">
                <a href="https://www.facebook.com/alihuseynovich" target="_blank" class="social-link">
                    <img src="https://img.icons8.com/?size=100&id=6JVVYaPk4wp2&format=png&color=000000" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/alihuseynovich" target="_blank" class="social-link">
                    <img src="https://img.icons8.com/?size=100&id=ZOFC5nSr215Y&format=png&color=000000" alt="Instagram">
                </a>
                <a href="https://az.linkedin.com/in/alihuseynovich" target="_blank" class="social-link">
                    <img src="https://img.icons8.com/?size=100&id=uzhJQ5CyNoaH&format=png&color=000000" alt="LinkedIn">
                </a>
                <a href="https://www.youtube.com/@alihuseynovich" target="_blank" class="social-link">
                    <img src="https://img.icons8.com/?size=100&id=NgVx6SS0Wbjb&format=png&color=000000" alt="YouTube">
                </a>
                <a href="https://x.com/alihuseynovich" target="_blank" class="social-link">
                    <img src="https://img.icons8.com/?size=100&id=zWrz2bjEiP4D&format=png&color=000000" alt="X">
                </a>
            </div>

            <div class="back-button" onclick="showMainMenu()">
                <img src="https://img.icons8.com/?size=100&id=DAo1YDH48w1q&format=png&color=000000" alt="Geri Dön">
            </div>
        </div>

        <div class="footer-signature">©2025-2026</div>
    </div>

    <script>
        const mainMenu = document.getElementById('mainMenu');
        const socialMenu = document.getElementById('socialMenu');

        // Bölmələri açan funksiya
        function showSection(sectionId) {
            mainMenu.style.opacity = '0';
            mainMenu.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                mainMenu.classList.add('hidden');
                
                const targetSection = document.getElementById(sectionId);
                targetSection.classList.remove('hidden');
                
                setTimeout(() => {
                    targetSection.style.opacity = '1';
                    targetSection.style.transform = 'scale(1)';
                }, 50);
            }, 300);
        }

        // Əsas menyuya qayıdan funksiya
        function showMainMenu() {
            socialMenu.style.opacity = '0';
            socialMenu.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                socialMenu.classList.add('hidden');
                mainMenu.classList.remove('hidden');
                
                setTimeout(() => {
                    mainMenu.style.opacity = '1';
                    mainMenu.style.transform = 'scale(1)';
                }, 50);
            }, 300);
        }
    </script>

</body>
</html>
